# Builds and publishes a release when a v* tag is pushed: the packages of
# both editions (.ipk for OpenWrt 24.10, .apk for OpenWrt 25.x),
# SHA256SUMS, and docs/release-notes/<tag>.md as the notes. Releases
# before 1.0 and tags with a "-" are betas (pre-releases).
#
# Two jobs: build runs third-party code (Go modules, the OpenWrt image)
# with a read-only token that checkout does not keep; publish has the
# write token and runs only gh on the built files.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # The scripts read the tag from here, never from ${{ }} in their text: a
  # tag name may hold $( ) and quotes.
  TAG: ${{ github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The check below reads the ci runs of the tagged commit.
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: The tag is a commit of main with green CI and its release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not a commit of main"; exit 1; }
          test -f "docs/release-notes/$TAG.md" || { echo "::error::docs/release-notes/$TAG.md is missing"; exit 1; }
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          [ "$ok" -gt 0 ] || { echo "::error::ci has not passed for $GITHUB_SHA"; exit 1; }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Packages
        run: |
          bash build/package.sh "${TAG#v}" "$RUNNER_TEMP/out"
          docker run --rm -v "$RUNNER_TEMP/out:/out" alpine:3.24.4 /bin/sh /out/apk.sh
          mkdir -p dist
          cp "$RUNNER_TEMP"/out/packages/*.ipk "$RUNNER_TEMP"/out/packages/*.apk dist/
          cp "docs/release-notes/$TAG.md" dist/notes.md
          (cd dist && sha256sum ./*.ipk ./*.apk | sed 's| \./| |' > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A published release is never replaced.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, nothing to publish"
            exit 0
          fi
          pre=""
          case "$TAG" in v0.*|*-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/*.ipk dist/*.apk dist/SHA256SUMS --verify-tag --title "HyRouter $TAG" --notes-file dist/notes.md $pre
