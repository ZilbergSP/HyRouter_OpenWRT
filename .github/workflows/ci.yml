# Checks on every push. The maintainer's PC has no Go: this workflow is
# where the code is built and tested. Every check runs even after another
# one failed, so one run shows all the problems. Actions are pinned by
# commit SHA; the tag is in the comment.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            gofmt -d $files
            echo "::error::gofmt -l lists: $files"
            exit 1
          fi
      - name: go.mod and go.sum are tidy
        if: ${{ !cancelled() }}
        run: go mod tidy -diff
      - name: go vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: go test
        if: ${{ !cancelled() }}
        run: go test -race ./...
      - name: HyRouter Lite (vet and tests with -tags lite)
        if: ${{ !cancelled() }}
        run: |
          go vet -tags lite ./...
          go test -tags lite ./internal/edition/ ./internal/nft/ ./internal/rules/
      # KeeneticOS: the same code with iptables and Entware's paths.
      - name: KeeneticOS (vet and tests with -tags keenetic)
        if: ${{ !cancelled() }}
        run: |
          go vet -tags keenetic ./...
          go vet -tags keenetic,lite ./...
          go test -race -tags keenetic ./internal/platform/ ./internal/ipt/ ./internal/zapret/ ./internal/ctl/ ./internal/store/ ./internal/auth/
          go test -tags keenetic,lite ./internal/edition/ ./internal/platform/
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      - name: Web interface (type check and build)
        if: ${{ !cancelled() }}
        working-directory: web
        run: |
          npm ci
          npx svelte-check --threshold warning
          npm run build
      - name: web/dist matches the sources
        if: ${{ !cancelled() }}
        run: |
          git status --porcelain web/dist
          test -z "$(git status --porcelain web/dist)" || { echo "::error::web/dist is stale: run npm run build in web and commit it"; exit 1; }
      # Every finding reached by a call fails, but those listed in
      # .github/govulncheck-allow.txt with the reason they do not apply.
      - name: Known vulnerabilities (govulncheck)
        if: ${{ !cancelled() }}
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -format json ./... >"$RUNNER_TEMP/vuln.json"
          jq -e 'select(.config != null)' "$RUNNER_TEMP/vuln.json" >/dev/null
          jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' "$RUNNER_TEMP/vuln.json" | sort -u >"$RUNNER_TEMP/found.txt"
          grep -o '^GO-[0-9]*-[0-9]*' .github/govulncheck-allow.txt | sort -u >"$RUNNER_TEMP/allowed.txt"
          bad=$(comm -23 "$RUNNER_TEMP/found.txt" "$RUNNER_TEMP/allowed.txt")
          echo "found: $(tr '\n' ' ' <"$RUNNER_TEMP/found.txt")"
          if [ -n "$bad" ]; then
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... || true
            echo "::error::govulncheck: $bad"
            exit 1
          fi
      # «Обход DPI»: the zapret2 release pinned in build/deps.json, every
      # file checked against its sum, the way hyrouterd will install it.
      - name: zapret2 release (build/deps.json)
        if: ${{ !cancelled() }}
        run: |
          z="$RUNNER_TEMP/zapret2"
          mkdir -p "$z"
          curl -fsSL --retry 10 --retry-delay 15 --retry-all-errors "$(jq -r .zapret2.url build/deps.json)" -o "$z/release.zip"
          echo "$(jq -r .zapret2.sha256 build/deps.json)  $z/release.zip" | sha256sum -c
          unzip -q "$z/release.zip" -d "$z"
          jq -r --arg z "$z" '.zapret2.files | to_entries[] | "\(.value)  \($z)/\(.key)"' build/deps.json | sha256sum -c
          chmod +x "$z/zapret2-$(jq -r .zapret2.version build/deps.json)/binaries/linux-x86_64/nfqws2"
      - name: nfqws2 takes every command line, nftables every rule set
        if: ${{ !cancelled() }}
        run: |
          zdir="$RUNNER_TEMP/zapret2/zapret2-$(jq -r .zapret2.version build/deps.json)"
          export HYROUTER_NFT_DIR="$RUNNER_TEMP/nft"
          go test -c -o "$RUNNER_TEMP/zapret.test" ./internal/zapret
          "$RUNNER_TEMP/zapret.test" -test.v -test.run NFTFiles
          go test -c -o "$RUNNER_TEMP/nft.test" ./internal/nft
          "$RUNNER_TEMP/nft.test" -test.v -test.run NFTFiles
          # As root, like hyrouterd: nfqws2 drops to --user only from root.
          # QueueTaken: another nfqws2 holds queue 200 (no rule sends it
          # packets), as another DPI bypass on a router does.
          sudo modprobe nfnetlink_queue || true
          sudo HYROUTER_ZAPRET_DIR="$zdir" "$RUNNER_TEMP/zapret.test" -test.v -test.run 'NFQWS2DryRun|QueueTaken'
          sudo apt-get install -y -qq nftables >/dev/null
          for f in "$HYROUTER_NFT_DIR"/*.nft; do
            echo "== $f"
            sudo nft -c -f "$f"
          done
      # KeeneticOS: every rule set of the routing, the boot guard and the
      # DPI bypass through iptables-restore --test (legacy iptables, as
      # Entware's), with their ipsets made first.
      - name: iptables takes every rule set (KeeneticOS)
        if: ${{ !cancelled() }}
        run: |
          export HYROUTER_IPT_DIR="$RUNNER_TEMP/ipt"
          go test -run IPTFiles -v ./internal/ipt ./internal/zapret
          sudo apt-get install -y -qq ipset >/dev/null
          sudo modprobe -a ip_set ip_set_hash_ip ip_set_hash_net xt_set iptable_mangle ip6table_mangle iptable_nat ip6table_nat iptable_filter ip6table_filter || true
          for s in "$HYROUTER_IPT_DIR"/*.ipset; do
            echo "== $s"
            sudo ipset -exist restore <"$s"
          done
          for f in "$HYROUTER_IPT_DIR"/*.rules; do
            case "$f" in
            *-6-*) tool=ip6tables-legacy-restore ;;
            *) tool=iptables-legacy-restore ;;
            esac
            echo "== $f"
            sudo "$tool" --test --noflush <"$f"
          done
          sudo ipset list -n | grep '^hyr_' | xargs -rn1 sudo ipset destroy
      - name: hyrouterd for the routers (HyRouter arm64, amd64; Lite mipsle, armv7; KeeneticOS arm64, mipsle, mips)
        if: ${{ !cancelled() }}
        run: |
          export CGO_ENABLED=0 GOOS=linux
          for arch in arm64 amd64; do
            GOARCH=$arch go build -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/hyrouterd-$arch" ./cmd/hyrouterd
          done
          GOARCH=mipsle GOMIPS=softfloat go build -tags lite -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/hyrouterd-lite-mipsle" ./cmd/hyrouterd
          GOARCH=arm GOARM=7 go build -tags lite -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/hyrouterd-lite-armv7" ./cmd/hyrouterd
          GOARCH=arm64 go build -tags keenetic -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/hyrouterd-keenetic-arm64" ./cmd/hyrouterd
          GOARCH=mipsle GOMIPS=softfloat go build -tags keenetic,lite -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/hyrouterd-keenetic-lite-mipsle" ./cmd/hyrouterd
          GOARCH=mips GOMIPS=softfloat go build -tags keenetic,lite -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/hyrouterd-keenetic-lite-mips" ./cmd/hyrouterd
          ls -l "$RUNNER_TEMP"/hyrouterd-*
  # The routing itself, in network namespaces with a real Hysteria 2
  # server (test/netns.sh). Root only: here, never on a maintainer's PC.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: shellcheck
        run: shellcheck test/netns.sh build/keenetic/50-hyrouter.sh
      - name: hyrouterd and the pinned Hysteria
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/hyrouterd" ./cmd/hyrouterd
          curl -fsSL --retry 10 --retry-delay 15 --retry-all-errors "$(jq -r .hysteria.assets.amd64.url build/deps.json)" -o "$RUNNER_TEMP/hysteria"
          echo "$(jq -r .hysteria.assets.amd64.sha256 build/deps.json)  $RUNNER_TEMP/hysteria" | sha256sum -c
          chmod +x "$RUNNER_TEMP/hysteria"
          sudo apt-get install -y -qq nftables dnsmasq-base >/dev/null
      - name: Routing in network namespaces
        run: sudo bash test/netns.sh "$RUNNER_TEMP/hyrouterd" "$RUNNER_TEMP/hysteria" "$(jq -r .hysteria.version build/deps.json)"
      # HyRouter Lite: the same checks with the Hysteria client inside
      # hyrouterd (internal/hycore) and no hysteria binary on the router.
      - name: Routing in network namespaces, HyRouter Lite
        if: ${{ !cancelled() }}
        run: |
          CGO_ENABLED=0 go build -tags lite -o "$RUNNER_TEMP/hyrouterd-lite" ./cmd/hyrouterd
          sudo HYROUTER_EMBEDDED=1 bash test/netns.sh "$RUNNER_TEMP/hyrouterd-lite" "$RUNNER_TEMP/hysteria" "$(jq -r .hysteria.version build/deps.json)"
      # KeeneticOS: iptables and ipset (legacy, as Entware's) instead of
      # nftables, the firmware rebuilding its tables, HyRouter Lite as most
      # Keenetic routers get it.
      - name: Routing in network namespaces, KeeneticOS (iptables)
        if: ${{ !cancelled() }}
        run: |
          CGO_ENABLED=0 go build -tags keenetic,lite -o "$RUNNER_TEMP/hyrouterd-keenetic" ./cmd/hyrouterd
          sudo apt-get install -y -qq ipset >/dev/null
          sudo HYROUTER_EMBEDDED=1 HYROUTER_PLATFORM=keenetic bash test/netns.sh "$RUNNER_TEMP/hyrouterd-keenetic" "$RUNNER_TEMP/hysteria" "$(jq -r .hysteria.version build/deps.json)"
  # The packages of both editions, installed on OpenWrt 24.10 (opkg) and
  # 25.12 (apk) in the official rootfs images.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: shellcheck
        run: shellcheck build/package.sh build/apk.sh build/openwrt/postinst build/openwrt/prerm build/openwrt/hyrouter-guard.init build/keenetic/S99hyrouter build/keenetic/postinst build/keenetic/prerm
      - name: Packages (.ipk and .apk)
        run: |
          HYROUTER_TEST_ENTWARE=1 bash build/package.sh 0.0.0 "$RUNNER_TEMP/out"
          docker run --rm -v "$RUNNER_TEMP/out:/out" alpine:3.24.4 /bin/sh /out/apk.sh
      - name: Install on OpenWrt 24.10 (opkg)
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$RUNNER_TEMP/out/packages:/p:ro" openwrt/rootfs:x86-64-24.10.8 /bin/sh -c '
            set -e
            mkdir -p /var/lock
            opkg update >/dev/null
            opkg install /p/hyrouter_0.0.0-1_x86_64.ipk
            hyrouterd -version
            sh -n /etc/init.d/hyrouter
            sh -n /etc/init.d/hyrouter-guard
            test -x /usr/share/hyrouter/zapret/nfqws2
            test -f /usr/share/hyrouter/zapret/lua/zapret-lib.lua
            test -f /usr/share/hyrouter/zapret/blobs/tls_clienthello_vk_com.bin
            # The kill switch at boot closes the LAN interfaces of the settings.
            echo "{\"enabled\":true,\"killSwitch\":true,\"lan\":[\"br-lan\",\"br-guest\"]}" >/etc/hyrouter/settings.json
            /etc/init.d/hyrouter-guard boot
            nft list table inet hyrouter_guard >/tmp/guard
            grep -q br-guest /tmp/guard
            grep -q br-lan /tmp/guard
            grep -q reject /tmp/guard
            grep -q /etc/hyrouter/ /lib/upgrade/keep.d/hyrouter
            opkg remove hyrouter
            test ! -e /usr/bin/hyrouterd
            # Removing HyRouter opens the LAN again.
            if nft list table inet hyrouter_guard >/dev/null 2>&1; then echo "the guard stayed"; exit 1; fi'
      - name: Install on OpenWrt 25.12 (apk)
        run: |
          docker run --rm -v "$RUNNER_TEMP/out/packages:/p:ro" openwrt/rootfs:x86-64-25.12.6 /bin/sh -c '
            set -e
            apk update >/dev/null
            apk add --allow-untrusted /p/hyrouter-0.0.0-r1_x86_64.apk
            hyrouterd -version
            sh -n /etc/init.d/hyrouter
            sh -n /etc/init.d/hyrouter-guard
            apk del hyrouter
            test ! -e /usr/bin/hyrouterd'
      # KeeneticOS: Entware for x64 (the same packages as the routers' ones,
      # built for x64-3.2) in a Debian container. The service starts and
      # answers; the firmware itself is not there.
      - name: Install in Entware (KeeneticOS package)
        run: |
          docker run --rm -v "$RUNNER_TEMP/out/packages:/p:ro" debian:bookworm-slim /bin/sh -c '
            set -e
            apt-get update -qq >/dev/null
            apt-get install -y -qq wget ca-certificates >/dev/null
            wget -qO- http://bin.entware.net/x64-k3.2/installer/generic.sh | sh >/dev/null
            export PATH=/opt/bin:/opt/sbin:$PATH
            opkg install /p/hyrouter-keenetic_0.0.0-1_x64-3.2.ipk
            hyrouterd -version | grep -q KeeneticOS
            sh -n /opt/etc/init.d/S99hyrouter
            sh -n /opt/etc/ndm/netfilter.d/50-hyrouter.sh
            test -x /opt/share/hyrouter/zapret/nfqws2
            test -f /opt/share/hyrouter/zapret/lua/zapret-lib.lua
            test -x /opt/sbin/iptables-restore
            test -x /opt/sbin/ipset
            test -s /opt/etc/ssl/certs/ca-certificates.crt
            test -d /opt/etc/hyrouter
            # postinst started the service: its interface answers.
            ok=""
            for i in $(seq 1 20); do
              if wget -qO- http://127.0.0.1:8088/api/session | grep -q keenetic; then ok=1; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then cat /tmp/hyrouter/hyrouterd.log; echo "the interface did not answer"; exit 1; fi
            /opt/etc/init.d/S99hyrouter status
            opkg remove hyrouter-keenetic
            test ! -e /opt/sbin/hyrouterd
            if wget -qO- -T 2 http://127.0.0.1:8088/api/session >/dev/null 2>&1; then echo "still running"; exit 1; fi'
