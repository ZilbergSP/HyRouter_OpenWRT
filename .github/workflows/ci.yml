# Checks on every push. The maintainer's PC has no Go: this workflow is
# where the code is built and tested. Every check runs even after another
# one failed, so one run shows all the problems. Actions are pinned by
# commit SHA; the tag is in the comment.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            gofmt -d $files
            echo "::error::gofmt -l lists: $files"
            exit 1
          fi
      - name: go.mod and go.sum are tidy
        if: ${{ !cancelled() }}
        run: go mod tidy -diff
      - name: go vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: go test
        if: ${{ !cancelled() }}
        run: go test -race ./...
      - name: Known vulnerabilities (govulncheck)
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # «Обход DPI»: the zapret2 release pinned in build/deps.json, every
      # file checked against its sum, the way hyrouterd will install it.
      - name: zapret2 release (build/deps.json)
        if: ${{ !cancelled() }}
        run: |
          z="$RUNNER_TEMP/zapret2"
          mkdir -p "$z"
          curl -fsSL "$(jq -r .zapret2.url build/deps.json)" -o "$z/release.zip"
          echo "$(jq -r .zapret2.sha256 build/deps.json)  $z/release.zip" | sha256sum -c
          unzip -q "$z/release.zip" -d "$z"
          jq -r --arg z "$z" '.zapret2.files | to_entries[] | "\(.value)  \($z)/\(.key)"' build/deps.json | sha256sum -c
          chmod +x "$z/zapret2-$(jq -r .zapret2.version build/deps.json)/binaries/linux-x86_64/nfqws2"
      - name: nfqws2 takes every command line, nftables every rule set
        if: ${{ !cancelled() }}
        run: |
          export HYROUTER_ZAPRET_DIR="$RUNNER_TEMP/zapret2/zapret2-$(jq -r .zapret2.version build/deps.json)"
          export HYROUTER_NFT_DIR="$RUNNER_TEMP/nft"
          go test -v -run 'NFQWS2DryRun|NFTFiles' ./internal/zapret/
          sudo apt-get install -y -qq nftables >/dev/null
          for f in "$HYROUTER_NFT_DIR"/*.nft; do
            echo "== $f"
            sudo nft -c -f "$f"
          done
      - name: hyrouterd for the routers (arm64, amd64)
        if: ${{ !cancelled() }}
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/hyrouterd-$arch" ./cmd/hyrouterd
            ls -l "$RUNNER_TEMP/hyrouterd-$arch"
          done
