# Adds Go modules without a local Go: run by hand with the modules and
# the packages that will import them; prints go.mod and go.sum as tidy
# makes them, to be committed together with the code that imports them.
name: deps
on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'module@version list, space separated'
        required: true
      imports:
        description: 'packages the code will import, space separated'
        required: true
permissions:
  contents: read
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: go get and go mod tidy
        env:
          MODULES: ${{ inputs.modules }}
          IMPORTS: ${{ inputs.imports }}
        run: |
          go get $MODULES
          {
            echo 'package deps'
            echo 'import ('
            for p in $IMPORTS; do echo "	_ \"$p\""; done
            echo ')'
          } > deps_tmp.go
          go mod tidy
          rm deps_tmp.go
          echo '=====go.mod====='
          cat go.mod
          echo '=====go.sum====='
          cat go.sum
          echo '=====end====='
